[project]
name = "sow_generator"
version = "0.1.0"
description = "AI based Statement of Work (SOW) generator"
requires-python = ">=3.12"
dependencies = [
    "google-adk==1.25.1",
    "google-auth>=2.40.3,<3.0.0",
    "google-cloud-logging>=3.12.1,<4.0.0",
    "opentelemetry-exporter-gcp-logging>=1.9.0a0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.37.0",
    "opentelemetry-instrumentation-google-genai>=0.4b0,<0.5",
    "opentelemetry-instrumentation-logging>=0.58b0,<0.59",
    "pydantic>=2.11.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "google-cloud-trace>=1.13.0",
    "google-api-python-client>=2.190.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.3.0",
    "python-pptx>=1.0.2",
    "google-cloud-storage>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.7,<1.0.0",
    "mypy>=1.17.1,<2.0.0",
    "pytest>=8.3.4,<9.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "ipykernel>=7.0.0,<8.0.0",
    "types-grpcio>=1.0.0.20251009,<2.0.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
]

[build-system]
requires = ["uv_build>=0.8.21,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 88
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["sow_generator"]
warn_return_any = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/sow_generator/**/__init__.py",
    "src/sow_generator/server.py",
    "src/sow_generator/**/agent.py",
    "src/sow_generator/**/prompt.py",
    "src/sow_generator/utils/observability.py",
]

[tool.coverage.report]
fail_under = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
